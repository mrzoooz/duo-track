name: track
run-name: "${{ inputs.mode || 'poll' }} ${{ inputs.config || 'config.json' }}"

on:
  # Tracker turned off: the watchdog schedule is removed. To turn it back on, restore
  #   schedule:
  #     - cron: "*/15 * * * *"   # watchdog: starts a tracker run if none is active
  # and start a poll run (Actions -> track -> Run workflow).
  workflow_dispatch:
    inputs:
      mode:
        description: "poll | once | diagnose | test-alert"
        type: choice
        options: [poll, once, diagnose, test-alert]
        default: poll
      config:
        description: "which product config to track"
        type: choice
        options: [config.json, tests/test.json]
        default: config.json
      minutes:
        description: "poll mode: minutes before this run hands off to a fresh runner"
        default: "40"
      until:
        description: "optional ISO time to stop at (set automatically for test configs)"
        default: ""
      handoff_from:
        description: "internal: run id of the run that started this one"
        default: ""

permissions:
  actions: write   # dispatch the next run (every ~40 min, or early if Apple blocks this runner)
  issues: write    # live status issue for the Pages dashboard + alert issues that @mention you
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Track pickup availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ inputs.mode || 'poll' }}
          CONFIG: ${{ inputs.config || 'config.json' }}
          MINUTES: ${{ inputs.minutes || '40' }}
          UNTIL: ${{ inputs.until }}
          HANDOFF_FROM: ${{ inputs.handoff_from }}
        run: python3 track.py --mode "$MODE" --config "$CONFIG" --max-minutes "$MINUTES" --until "$UNTIL" --handoff-from "$HANDOFF_FROM"
