name: track
run-name: "${{ inputs.mode || 'poll' }} ${{ inputs.config || 'config.json' }}"

on:
  schedule:
    - cron: "*/15 * * * *"   # watchdog: starts a tracker run if none is active
  workflow_dispatch:
    inputs:
      mode:
        description: "poll | once | diagnose | test-alert"
        type: choice
        options: [poll, once, diagnose, test-alert]
        default: poll
      config:
        description: "which product config to track"
        type: choice
        options: [config.json, tests/iphone-18-pro-max.json]
        default: config.json
      minutes:
        description: "poll mode: minutes before this run ends (and hands off, unless the config disables it)"
        default: "340"
      handoff_from:
        description: "internal: run id of the run that started this one"
        default: ""

permissions:
  actions: write   # dispatch the next run at the ~6h job limit
  issues: write    # live status issue for the Pages dashboard + alert issues that @mention you
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Track pickup availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'poll' }}
          CONFIG: ${{ inputs.config || 'config.json' }}
          MINUTES: ${{ inputs.minutes || '340' }}
          HANDOFF_FROM: ${{ inputs.handoff_from }}
        run: python3 track.py --mode "$MODE" --config "$CONFIG" --max-minutes "$MINUTES" --handoff-from "$HANDOFF_FROM"
