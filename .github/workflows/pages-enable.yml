name: pages-enable (one-off)
on: workflow_dispatch
permissions:
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from main /docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f "source[branch]=main" -f "source[path]=/docs" || true
          gh api "repos/$GITHUB_REPOSITORY/pages" || true
